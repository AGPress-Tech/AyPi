<!DOCTYPE html>
<html lang="it">

<head>
            <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' 'unsafe-inline' file: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' file: https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' file: https://fonts.gstatic.com data:; img-src 'self' file: data: blob:; connect-src 'self' file:; media-src 'self' file: data: blob:; object-src 'none'; base-uri 'self'; frame-src 'self'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyPi</title>
    <link rel="stylesheet" href="../styles/produzioni-style.css">
    <link rel="stylesheet" href="../styles/agpress-shell.css">
</head>

<body class="agpress-shell agpress-launcher">
    <div id="main">
        <div id="sidebar-container"></div>

        <header class="ag-topbar">
            <span id="menuBtn" class="ag-menu-button" role="button" tabindex="0" aria-label="Apri menu" aria-expanded="false">&#9776;</span>
            <div class="ag-brand"><img src="../assets/app-icon.png" alt=""><div class="ag-brand__copy"><strong>AyPi</strong><small>AGPress workspace</small></div></div>
            <div class="ag-topbar__actions"><span class="ag-topbar__status">Modalità AGPress</span><p id="appVersion">AyPi v...</p><img src="../assets/app-icon.png" alt="Apri repository AyPi" id="githubIcon"></div>
        </header>

        <main class="ag-content">
            <header class="ag-page-heading">
                <p class="ag-eyebrow">Registrazioni reparto</p>
                <h1>Produzioni</h1>
                <p>Registra e consulta le attività produttive dei reparti.</p>
            </header>
            <section class="agpress-launch-grid" aria-label="Registrazioni di produzione">
                <button id="openRegStampaggio"><span class="ag-card__icon">SP</span><span class="ag-card__copy"><strong>Registrazione Stampaggio</strong><small>Dati produttivi del reparto stampaggio</small></span></button>
                <button id="openRegTranceria"><span class="ag-card__icon">TR</span><span class="ag-card__copy"><strong>Registrazione Tranceria</strong><small>Dati produttivi del reparto tranceria</small></span></button>
                <button id="openRegTorneria"><span class="ag-card__icon">TO</span><span class="ag-card__copy"><strong>Registrazione Torneria</strong><small>Dati produttivi del reparto torneria</small></span></button>
            </section>
        </main>

        <script src="../scripts/produzioni-scripts.js"></script>

    </div>
</body>

</html>
