<!DOCTYPE html>
<html lang="it">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' 'unsafe-inline' file: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' file: https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' file: https://fonts.gstatic.com data:; img-src 'self' file: data: blob:; connect-src 'self' file:; media-src 'self' file: data: blob:; object-src 'none'; base-uri 'self'; frame-src 'self'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyPi</title>
    <link rel="stylesheet" href="../styles/infoarticoli-style.css">
    <link rel="stylesheet" href="../styles/agpress-shell.css">
</head>

<body class="agpress-shell agpress-launcher">
    <div id="main">
        <div id="sidebar-container"></div>

        <header class="ag-topbar">
            <span id="menuBtn" class="ag-menu-button" role="button" tabindex="0" aria-label="Apri menu" aria-expanded="false">&#9776;</span>
            <div class="ag-brand"><img src="../assets/app-icon.png" alt=""><div class="ag-brand__copy"><strong>AyPi</strong><small>AGPress workspace</small></div></div>
            <div class="ag-topbar__actions"><span class="ag-topbar__status">Modalità AGPress</span><p id="appVersion">AyPi v...</p><img src="../assets/app-icon.png" alt="Apri repository AyPi" id="githubIcon"></div>
        </header>

        <main class="ag-content">
            <header class="ag-page-heading">
                <p class="ag-eyebrow">Dati di prodotto</p>
                <h1>Articoli e documentazione</h1>
                <p>Consulta disegni, cicli, schede tecniche e registrazioni collegate agli articoli.</p>
            </header>
            <section class="infoarticoli-actions agpress-launch-grid" aria-label="Informazioni articoli">
                <button id="openTavole"><span class="ag-card__icon">TD</span><span class="ag-card__copy"><strong>Tavole e Disegni</strong><small>Documentazione tecnica degli articoli</small></span></button>
                <button id="openCicli"><span class="ag-card__icon">CL</span><span class="ag-card__copy"><strong>Cicli di Lavorazione</strong><small>Sequenze e parametri di produzione</small></span></button>
                <button id="openMontaggioStampi"><span class="ag-card__icon">MS</span><span class="ag-card__copy"><strong>Schede Montaggio Stampi</strong><small>Istruzioni e riferimenti di montaggio</small></span></button>
                <button id="openDifettiProduzione"><span class="ag-card__icon">DP</span><span class="ag-card__copy"><strong>Schede Difetti di Produzione</strong><small>Difetti noti e indicazioni operative</small></span></button>
                <button id="openSchedeAttrezzaggioTransfer"><span class="ag-card__icon">SA</span><span class="ag-card__copy"><strong>Schede Attrezzaggio</strong><small>Metodi per transfer e centri di lavoro</small></span></button>
                <button id="openRegistrazioniProgettazione"><span class="ag-card__icon">RP</span><span class="ag-card__copy"><strong>Registrazioni Progettazione</strong><small>Fasi e sviluppo dei progetti</small></span></button>
                <button id="openInventarioMagazzino"><span class="ag-card__icon">IM</span><span class="ag-card__copy"><strong>Inventario Magazzino</strong><small>Ubicazioni, cassoni e movimentazioni</small></span></button>
            </section>
        </main>

        <script src="../scripts/infoarticoli-scripts.js"></script>

    </div>
</body>

</html>
