<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>AyPi · Cicli di lavorazione</title><script src="../scripts/utility-layout-bootstrap.js"></script><link rel="stylesheet" href="../styles/attrezzaggio-style.css"><link rel="stylesheet" href="../styles/utilities/aypi-module-brand.css"><link rel="stylesheet" href="../styles/utilities/aypi-operations-ui.css"><link rel="stylesheet" href="../styles/processing-cycles.css"></head>
<body class="aypi-operations processing-cycles-window"><header class="topbar"><div class="aypi-module-logo" role="img" aria-label="AyPi"><span class="aypi-module-logo__halo" aria-hidden="true"></span><span class="aypi-module-logo__ay">Ay</span><span class="aypi-module-logo__pi">Pi</span><span class="aypi-module-logo__slash"></span></div><div><div class="eyebrow">UFFICIO TECNICO / OFFICINA</div><h1>Cicli di lavorazione</h1></div><div class="global-actions"><button id="legacy">Archivio precedente</button></div></header>
<main class="cycle-workspace"><section id="homeView"><article class="home-card"><div class="home-card__topline"><span>AYPI // CICLI DI LAVORAZIONE</span><span class="home-card__status"><i></i>Ufficio tecnico</span></div><h2>Cicli di lavorazione</h2><div class="home-actions"><button id="showList" class="home-action"><span class="home-action__code">01 // ARCHIVIO</span><strong>Lista schede</strong><small>Cerca, consulta e modifica i cicli</small></button><button id="showCreate" class="home-action"><span class="home-action__code">02 // NUOVO</span><strong>Inserisci nuovo ciclo</strong><small>Compila la scheda e le fasi di produzione</small></button><button id="close" class="home-action home-action--quiet"><span class="home-action__code">ESC // USCITA</span><strong>Chiudi modulo</strong><small>Torna alla schermata principale</small></button></div></article></section>
<section id="listView" hidden><div class="toolbar"><button id="listBack">Indietro</button><button id="newCycle" class="primary">+ Nuovo ciclo</button><button id="refreshList">Aggiorna</button><span id="listCount"></span></div><div class="cycle-list-filters"><label>Codice prodotto<input id="filterProduct" type="search"></label><label>Cliente<input id="filterCustomer" type="search"></label><label>Macchina<input id="filterMachine" type="search"></label><label>Metodo<input id="filterMethod" type="search"></label><label class="free-search">Ricerca libera<input id="filterSearch" type="search" placeholder="Disegno, materiale, programma, attrezzista…"></label><label>Ordina<select id="listSort"><option value="product-asc">Prodotto A–Z</option><option value="product-desc">Prodotto Z–A</option><option value="updated-desc">Ultima modifica</option><option value="method-asc">Metodo A–Z</option></select></label><details data-filter-popover><summary>Altri filtri</summary><div id="advancedListFilters" class="cycle-filter-popup"></div></details><button id="resetListFilters">Ripristina</button></div><ul id="cycleList" class="cards-list"></ul><button id="moreCycles" hidden>Carica altri cicli</button></section>
